<!DOCTYPE html>
<html>
<head>
    <title>Secure GPS Tracker</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #111; color: #fff; }
        #lockScreen { position: fixed; top:0; left:0; width:100%; height:100%; background:#111; display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:9999; }
        #lockScreen input { padding: 12px; font-size: 1.2em; margin-bottom: 10px; border-radius: 5px; border: none; text-align: center; width: 80%; max-width: 300px; }
        #lockScreen button { padding: 10px 20px; font-size: 1.1em; background: #0066ff; color: #fff; border: none; border-radius: 5px; cursor: pointer; }
        #map { height: 80vh; width: 100%; }
        .header { padding: 15px; background: #222; text-align: center; }
    </style>
</head>
<body>

    <!-- Passkey Prompt Overlay -->
    <div id="lockScreen">
        <h3>Enter Passkey</h3>
        <input type="password" id="passkeyInput" placeholder="Passkey">
        <button onclick="unlockAndDecrypt()">Access Map</button>
    </div>

    <div class="header">
        <h2>Secure Status Dashboard</h2>
    </div>

    <div id="appContent" style="display:none;">
        <div id="map"></div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        async function unlockAndDecrypt() {
            const passkey = document.getElementById('passkeyInput').value;
            if (!passkey) return alert('bad pass');

            try {
                // Fetch encrypted location blob
                const response = await fetch('location.json?t=' + Date.now());
                if (!response.ok) throw new Error("Data not found");
                const encryptedArray = await response.json();

                let validLocations = [];

                // Loop through stored encrypted entries to find any valid decodes
                for (let cipherBase64 of encryptedArray) {
                    try {
                        let decryptedText = await decryptWithPasskey(cipherBase64, passkey);
                        
                        // Validate header check (exact "OK|")
                        if (decryptedText && decryptedText.startsWith("OK|")) {
                            let parts = decryptedText.substring(3).split('|');
                            let coords = parts[0].split(',');
                            let lat = parseFloat(coords[0]);
                            let lng = parseFloat(coords[1]);
                            let timestamp = parts[1] || "Unknown Time";
                            
                            if (!isNaN(lat) && !isNaN(lng)) {
                                validLocations.push({
                                    lat: lat,
                                    lng: lng,
                                    time: timestamp
                                });
                            }
                        }
                    } catch (err) {
                        // Decryption failed for this specific row (wrong passkey or bad padding) - silently discard
                    }
                }

                if (validLocations.length === 0) {
                    alert('bad pass');
                    return;
                }

                // Unlock UI and initialize map
                document.getElementById('lockScreen').style.display = 'none';
                document.getElementById('appContent').style.display = 'block';
                initMap(validLocations);

            } catch (e) {
                alert('bad pass');
            }
        }

        // Browser Web Crypto API helper for AES decryption matching the Java app
        async function decryptWithPasskey(base64Cipher, passkey) {
            const enc = new TextEncoder();

            // Match Java's exact byte array behavior: 32 bytes initialized with null bytes
            const keyBytes = new Uint8Array(32);
            const passkeyEncoded = enc.encode(passkey);
            keyBytes.set(passkeyEncoded.subarray(0, 32));

            const keyMaterial = await window.crypto.subtle.importKey(
                "raw", keyBytes, { name: "AES-CBC" }, false, ["decrypt"]
            );

            const rawData = Uint8Array.from(atob(base64Cipher), c => c.charCodeAt(0));

            // Java uses a static 16-byte zero IV
            const iv = new Uint8Array(16);

            const decrypted = await window.crypto.subtle.decrypt(
                { name: "AES-CBC", iv: iv },
                keyMaterial,
                rawData
            );
            return new TextDecoder().decode(decrypted);
        }

        function initMap(locations) {
            var map = L.map('map').setView([locations[0].lat, locations[0].lng], 15);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; OpenStreetMap contributors'
            }).addTo(map);

            locations.forEach(function(loc, index) {
                var marker = L.marker([loc.lat, loc.lng]).addTo(map);
                var popupText = "<b>Date/Time:</b> " + loc.time;
                if (index === 0) {
                    popupText = "<b>Latest Position</b><br>" + popupText;
                    marker.bindPopup(popupText).openPopup();
                } else {
                    marker.bindPopup(popupText);
                }
            });
        }
    </script>
</body>
</html>
