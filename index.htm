<!DOCTYPE html>
<html>
<head>
    <title>Secure GPS Tracker</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #111; color: #fff; }
        #lockScreen { position: fixed; top:0; left:0; width:100%; height:100%; background:#111; display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:9999; }
        #lockScreen input { padding: 12px; font-size: 1.2em; margin-bottom: 10px; border-radius: 5px; border: none; text-align: center; }
        #lockScreen button { padding: 10px 20px; font-size: 1.1em; background: #0066ff; color: #fff; border: none; border-radius: 5px; cursor: pointer; }
        #map { height: 80vh; width: 100%; }
        .header { padding: 15px; background: #222; text-align: center; }
    </style>
</head>
<body>

    <!-- Passkey Prompt Overlay -->
    <div id="lockScreen">
        <h3>Enter Passkey</h3>
        <input type="password" id="passkeyInput" placeholder="Passkey">
        <button onclick="unlockAndDecrypt()">Access Map</button>
    </div>

    <div class="header">
        <h2>Secure Status Dashboard</h2>
    </div>

    <div id="appContent" style="display:none;">
        <div id="map"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        async function unlockAndDecrypt() {
            const passkey = document.getElementById('passkeyInput').value;
            if (!passkey) return alert('Enter a passkey');

            try {
                // Fetch encrypted location blob from GitHub Pages
                const response = await fetch('location.json?t=' + Date.now());
                if (!response.ok) throw new Error("Data not found");
                const encryptedArray = await response.json();

                let validLocations = [];

                // Loop through stored encrypted entries
                for (let cipherBase64 of encryptedArray) {
                    try {
                        let decryptedText = await decryptWithPasskey(cipherBase64, passkey);
                        
                        // Validate header check ("OK|")
                        if (decryptedText && decryptedText.startsWith("OK|")) {
                            let parts = decryptedText.substring(3).split('|');
                            let coords = parts[0].split(',');
                            let lat = parseFloat(coords[0]);
                            let lng = parseFloat(coords[1]);
                            
                            if (!isNaN(lat) && !isNaN(lng)) {
                                validLocations.push([lat, lng]);
                            }
                        }
                    } catch (err) {
                        // Decryption failed (wrong passkey or corrupt data) - silently discard
                    }
                }

                if (validLocations.length === 0) {
                    alert('Incorrect passkey or no valid records found.');
                    return;
                }

                // Unlock UI and initialize map
                document.getElementById('lockScreen').style.display = 'none';
                document.getElementById('appContent').style.display = 'block';
                initMap(validLocations);

            } catch (e) {
                alert('Error loading data: ' + e.message);
            }
        }

        // Browser Web Crypto API helper for AES decryption
        async function decryptWithPasskey(base64Cipher, passkey) {
            const enc = new TextEncoder();
            const keyMaterial = await window.crypto.subtle.importKey(
                "raw", enc.encode(passkey.padEnd(32, '0').substring(0, 32)), { name: "AES-CBC" }, false, ["decrypt"]
            );
            
            const rawData = Uint8Array.from(atob(base64Cipher), c => c.charCodeAt(0));
            // Assuming standard IV handling or simple ECB/CBC setup matching Java
            // (Using raw decode here)
            const decrypted = await window.crypto.subtle.decrypt(
                { name: "AES-CBC", iv: new Uint8Array(16) }, // Match IV config with Java side
                keyMaterial,
                rawData
            );
            return new TextDecoder().decode(decrypted);
        }

        function initMap(locations) {
            var map = L.map('map').setView(locations[0], 15);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; OpenStreetMap contributors'
            }).addTo(map);

            locations.forEach(function(coord, index) {
                var marker = L.marker(coord).addTo(map);
                if (index === 0) marker.bindPopup("<b>Latest Position</b>").openPopup();
            });
        }
    </script>
</body>
</html>
